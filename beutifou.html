<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEUTIFOU — Admin Legado</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--accent:#8b5cf6;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:#111827;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}header a{color:#cbd5e1;text-decoration:none}.wrap{max-width:1400px;margin:auto;padding:26px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:24px;margin:0}.btn{border:0;border-radius:7px;padding:10px 15px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#475569}.btn.danger{background:var(--danger)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:0 1px 2px #00000008}.card small{color:var(--muted)}.card strong{display:block;font-size:27px;margin-top:8px}.panel{margin-top:18px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.form input,.form select{border:1px solid var(--border);border-radius:7px;padding:10px;background:#fff}.toolbar input{flex:1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--border);vertical-align:middle}th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#ede9fe;color:#6d28d9;font-size:12px}.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:6px 9px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center}.modal.open{display:grid}.modal-box{background:#fff;border-radius:12px;padding:22px;width:min(620px,94vw)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:6px;color:var(--muted)}.form .wide{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.message{padding:10px;border-radius:7px;background:#eef2ff;margin-bottom:12px;display:none}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.table-wrap{overflow:auto}.form{grid-template-columns:1fr}}
.invite-box{display:none;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:14px;margin-bottom:12px}.invite-box strong{display:block;margin-bottom:8px}.invite-actions{display:flex;gap:8px;flex-wrap:wrap}.invite-actions a{text-decoration:none}
</style></head><body>
<header><strong>LEGADO ERP · ADMIN</strong><a href="index.html">← Voltar ao painel</a></header>
<main class="wrap"><div class="title"><div><h1>✦ BEUTIFOU</h1><div style="color:var(--muted);margin-top:5px">Estabelecimentos e operação da plataforma</div></div><button class="btn" onclick="openModal()">+ Novo BEUTIFOU</button></div>
<div id="message" class="message"></div><div id="inviteBox" class="invite-box"><strong>Convite seguro do proprietário pronto</strong><div class="invite-actions"><a id="openInvite" class="btn" target="_blank" rel="noopener">Abrir convite</a><button id="copyInvite" class="btn secondary" type="button">Copiar link</button></div></div><section class="cards" id="cards"></section>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar por nome ou slug" oninput="renderRows()"><select id="filter" onchange="renderRows()"><option value="">Todos os status</option><option>onboarding</option><option>trial_manual</option><option>active</option><option>suspended</option><option>cancelled</option></select><button class="btn secondary" onclick="load()">Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>Estabelecimento</th><th>Tipo</th><th>Status</th><th>Usuários</th><th>Profissionais</th><th>Agendamento</th><th>Criado em</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div class="modal" id="modal"><div class="modal-box"><h2>Novo estabelecimento BEUTIFOU</h2><form id="createForm" class="form"><label>Nome comercial<input name="name" required></label><label>Slug<input name="slug" pattern="[a-z0-9-]+" required></label><label>Proprietário<input name="owner_name" required></label><label>E-mail<input type="email" name="email" required></label><label>Telefone<input name="phone"></label><label>Tipo<select name="business_type"><option value="salao">Salão</option><option value="barbearia">Barbearia</option><option value="misto">Misto</option><option value="outro">Outro</option></select></label><label>Status<select name="status"><option value="onboarding">Onboarding</option><option value="trial_manual">Trial manual</option><option value="active">Ativo</option></select></label><label>Cor principal<input type="color" name="primary_color" value="#9b7352"></label><div class="foot wide"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" type="submit">Criar estabelecimento</button></div></form></div></div>
<script>
const SB_URL='https://zzqoxpgidalxjxhgyuot.supabase.co',SB_KEY='sb_publishable_amGgMLVijJ2gq74YblAjgw_4Di33qTn',API=SB_URL+'/functions/v1/lb-admin-beutifou';let data=[];
if(sessionStorage.getItem('admin_logado')!=='1'||!sessionStorage.getItem('admin_senha'))location.replace('index.html');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({action,senha_admin:sessionStorage.getItem('admin_senha'),...payload})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Falha no servidor');return j}
function msg(t,err=false){const e=document.getElementById('message');e.textContent=t;e.style.display='block';e.style.color=err?'#991b1b':'#3730a3';setTimeout(()=>e.style.display='none',6000)}
async function load(){try{const j=await call('list');data=j.rows||[];const s=j.summary||{},cards=[['Total de estabelecimentos',s.total],['Estabelecimentos ativos',s.active],['Onboarding / trial',s.onboarding],['Inativos / suspensos',s.inactive],['Novos em 30 dias',s.new_period],['Usuários vinculados',s.users],['Salões',s.salons],['Barbearias',s.barbershops]];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]||0}</strong></div>`).join('');renderRows()}catch(e){msg(e.message,true)}}
function renderRows(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const list=data.filter(x=>(!q||(x.name+' '+x.slug).toLowerCase().includes(q))&&(!f||x.status===f));document.getElementById('rows').innerHTML=list.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.slug)}</small></td><td>${esc(x.business_type||'—')}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.users_count}</td><td>${x.professionals_count}</td><td>${x.public_booking_enabled?'Ativo':'Inativo'}</td><td>${new Date(x.created_at).toLocaleDateString('pt-BR')}</td><td><div class="actions"><button class="btn secondary" onclick="copyLink('${esc(x.slug)}')">Link</button>${x.status==='active'?`<button class="btn danger" onclick="setStatus('${x.id}','suspended')">Suspender</button>`:`<button class="btn" onclick="setStatus('${x.id}','active')">Ativar</button>`}</div></td></tr>`).join('')||'<tr><td colspan="8">Nenhum estabelecimento encontrado.</td></tr>'}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function copyLink(slug){navigator.clipboard.writeText('https://app.beutifou.legadoerp.com.br/agendar/'+slug);msg('Link público copiado')}
async function setStatus(id,status){if(!confirm('Confirmar alteração para '+status+'?'))return;try{await call('status',{tenant_id:id,status});msg('Status atualizado e auditado');await load()}catch(e){msg(e.message,true)}}
function showInvite(link){const box=document.getElementById('inviteBox'),open=document.getElementById('openInvite'),copy=document.getElementById('copyInvite');if(!link){box.style.display='none';return}open.href=link;copy.onclick=async()=>{await navigator.clipboard.writeText(link);msg('Link de convite copiado')};box.style.display='block'}
document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const r=await call('create',b);closeModal();e.target.reset();showInvite(r.invite_link);msg(r.invite_link?'Tenant criado. Abra o convite seguro abaixo.':'Tenant criado e proprietário já vinculado.');await load()}catch(x){msg(x.message,true)}});load();
</script></body></html>

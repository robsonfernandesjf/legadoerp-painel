<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma Legado · Recicly</title><style>
:root{--bg:#f7f8fa;--surface:#fff;--border:#e5e7eb;--text:#1f2430;--muted:#6b7280;--accent:#16884b;--light:#eaf7ef;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--border);padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:19px;margin:0}main{max-width:1240px;margin:auto;padding:26px}.nav,.tabs,.actions{display:flex;gap:10px;flex-wrap:wrap}.nav{margin-bottom:20px}.btn{padding:9px 15px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:650;cursor:pointer;color:var(--text);text-decoration:none}.btn:hover,.btn.active{border-color:var(--accent);color:var(--accent);background:var(--light)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 3px #1018280f;overflow:hidden}.head{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{font-size:16px;margin:0}.tabs{margin-bottom:16px}.tab{display:none}.tab.active{display:block}table{width:100%;border-collapse:collapse}th,td{padding:12px 16px;text-align:left;border-top:1px solid var(--border);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.badge{padding:4px 9px;border-radius:6px;background:var(--light);color:var(--accent);font-weight:700}.badge.off{background:#fee2e2;color:var(--danger)}.empty{padding:36px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:14px;padding:24px;width:min(520px,100%)}.field{display:block;margin:12px 0}.field span{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px}.error{color:var(--danger);margin:8px 0}.login{max-width:430px;margin:80px auto;padding:26px}.muted{color:var(--muted)}.hidden{display:none}
</style></head><body>
<header><div><h1>♻ Plataforma Legado · Recicly</h1><div class="muted">Licenciamento e distribuição</div></div><a class="btn" href="index.html">Voltar ao painel</a></header>
<main><section id="login" class="card login"><h2>Acesso administrativo</h2><p class="muted">Use a conta autorizada no Supabase Auth.</p><label class="field"><span>E-mail</span><input id="email" type="email"></label><label class="field"><span>Senha</span><input id="password" type="password"></label><p id="login-error" class="error"></p><button class="btn primary" onclick="login()">Entrar</button></section>
<div id="content" class="hidden"><div class="nav"><button class="btn active" data-tab="licenses">Licenças</button><button class="btn" data-tab="versions">Versões</button><button class="btn" data-tab="installations">Instalações</button><button class="btn" data-tab="history">Histórico</button><button class="btn" onclick="load()">↻ Atualizar</button><button class="btn" onclick="logout()">Sair</button></div>
<section id="licenses" class="tab active card"><div class="head"><h2>Licenças Legado Recicly</h2><button class="btn primary" onclick="openLicense()">+ Nova licença</button></div><div id="licenses-list"></div></section>
<section id="versions" class="tab card"><div class="head"><h2>Versões publicadas</h2><button class="btn primary" onclick="openVersion()">+ Publicar versão</button></div><div id="versions-list"></div></section>
<section id="installations" class="tab card"><div class="head"><h2>Instalações</h2></div><div id="installations-list"></div></section>
<section id="history" class="tab card"><div class="head"><h2>Histórico de atualizações</h2></div><div id="history-list"></div></section></div></main>
<div id="license-modal" class="modal"><div class="box"><h2>Licença do Recicly</h2><input id="license-id" type="hidden"><label class="field"><span>Cliente</span><input id="license-name"></label><label class="field"><span>Chave</span><input id="license-key" placeholder="LR-XXXX-XXXX-XXXX"></label><label class="field"><span>Validade</span><input id="license-expiry" type="date"></label><label class="field"><span>Valor mensal</span><input id="license-value" type="number" min="0" step=".01"></label><label class="field"><span>Status</span><select id="license-active"><option value="true">Ativa</option><option value="false">Inativa</option></select></label><label class="field"><span>Observações</span><textarea id="license-notes"></textarea></label><p id="license-error" class="error"></p><div class="actions"><button class="btn" onclick="closeModal('license-modal')">Cancelar</button><button class="btn primary" onclick="saveLicense()">Salvar</button></div></div></div>
<div id="version-modal" class="modal"><div class="box"><h2>Publicar versão do Recicly</h2><label class="field"><span>Versão</span><input id="version-number" placeholder="3.1.0"></label><label class="field"><span>Instalador</span><input id="version-file" type="file" accept=".exe"></label><label class="field"><span>Alterações</span><textarea id="version-notes"></textarea></label><label class="field"><span>Liberação</span><select id="version-rollout"><option value="0">Rascunho</option><option value="10">10%</option><option value="50">50%</option><option value="100">100%</option></select></label><label class="field"><span>Tipo</span><select id="version-required"><option value="false">Normal</option><option value="true">Obrigatória</option></select></label><p id="version-error" class="error"></p><div class="actions"><button class="btn" onclick="closeModal('version-modal')">Cancelar</button><button class="btn primary" onclick="publishVersion()">Publicar</button></div></div></div>
<script>
const SB_URL="https://zzqoxpgidalxjxhgyuot.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6cW94cGdpZGFseGp4aGd5dW90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDI0NjIsImV4cCI6MjA5NzIxODQ2Mn0.FX-9C-u4xjDY1CS8vwOhbfIDPMGmHSbQUFpvxmQ9j5M",ADMIN_URL=SB_URL+"/functions/v1/lr-admin-plataforma";let token=sessionStorage.getItem("lr_admin_token")||"",data={};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(action,payload={}){const response=await fetch(ADMIN_URL,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+token},body:JSON.stringify({acao:action,...payload})});const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.erro||"Operação não concluída.");return body}
async function login(){try{const response=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({email:email.value,password:password.value})}),body=await response.json();if(!response.ok)throw Error(body.error_description||"Login inválido.");token=body.access_token;sessionStorage.setItem("lr_admin_token",token);show();await load()}catch(e){document.getElementById("login-error").textContent=e.message}}
function logout(){sessionStorage.removeItem("lr_admin_token");location.reload()}function show(){document.getElementById("login").classList.add("hidden");document.getElementById("content").classList.remove("hidden")}
document.querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-tab],.tab").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.getElementById(button.dataset.tab).classList.add("active")});
async function load(){try{data=await call("listar");render()}catch(e){if(token)alert(e.message)}}const table=(headers,rows)=>rows.length?`<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`:'<div class="empty">Nenhum registro.</div>';
function render(){document.getElementById("licenses-list").innerHTML=table(["Cliente","Chave","Validade","Status","Mensalidade",""],(data.licencas||[]).map(x=>`<tr><td>${esc(x.cliente_nome)}</td><td>${esc(x.chave)}</td><td>${new Date(x.validade+"T12:00").toLocaleDateString("pt-BR")}</td><td><span class="badge ${x.ativo?"":"off"}">${x.ativo?"Ativa":"Inativa"}</span></td><td>R$ ${Number(x.valor_mensal||0).toFixed(2)}</td><td><button class="btn" onclick='editLicense(${JSON.stringify(x)})'>Editar</button></td></tr>`));document.getElementById("versions-list").innerHTML=table(["Versão","Publicação","Liberação","Tipo"],(data.versoes||[]).map(x=>`<tr><td><b>v${esc(x.versao)}</b></td><td>${x.publicada?"Publicada":"Rascunho"}</td><td>${x.liberacao_percentual}%</td><td>${x.obrigatoria?"Obrigatória":"Normal"}</td></tr>`));document.getElementById("installations-list").innerHTML=table(["Cliente","Instalação","Versão","Último contato"],(data.instalacoes||[]).map(x=>`<tr><td>${esc(x.lr_licencas?.cliente_nome)}</td><td>${esc(x.instalacao_id)}</td><td>${esc(x.versao_atual)}</td><td>${new Date(x.ultimo_contato).toLocaleString("pt-BR")}</td></tr>`));document.getElementById("history-list").innerHTML=table(["Data","Cliente","Evento","Versões","Detalhe"],(data.historico||[]).map(x=>`<tr><td>${new Date(x.criado_em).toLocaleString("pt-BR")}</td><td>${esc(x.lr_licencas?.cliente_nome)}</td><td>${esc(x.evento)}</td><td>${esc(x.versao_anterior)} → ${esc(x.versao_nova)}</td><td>${esc(x.detalhe)}</td></tr>`))}
function generatedKey(){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",part=()=>Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join("");return `LR-${part()}-${part()}-${part()}`}function openLicense(){["license-id","license-name","license-notes"].forEach(id=>document.getElementById(id).value="");document.getElementById("license-key").value=generatedKey();const d=new Date();d.setDate(d.getDate()+30);document.getElementById("license-expiry").value=d.toISOString().slice(0,10);document.getElementById("license-value").value="0";document.getElementById("license-active").value="true";document.getElementById("license-modal").classList.add("show")}function editLicense(x){openLicense();document.getElementById("license-id").value=x.id;document.getElementById("license-name").value=x.cliente_nome;document.getElementById("license-key").value=x.chave;document.getElementById("license-expiry").value=x.validade;document.getElementById("license-value").value=x.valor_mensal;document.getElementById("license-active").value=String(x.ativo);document.getElementById("license-notes").value=x.obs||""}
async function saveLicense(){try{await call("salvar_licenca",{id:document.getElementById("license-id").value||undefined,cliente_nome:document.getElementById("license-name").value,chave:document.getElementById("license-key").value,validade:document.getElementById("license-expiry").value,valor_mensal:document.getElementById("license-value").value,ativo:document.getElementById("license-active").value==="true",obs:document.getElementById("license-notes").value});closeModal("license-modal");load()}catch(e){document.getElementById("license-error").textContent=e.message}}
function openVersion(){document.getElementById("version-modal").classList.add("show")}async function sha(file){const digest=await crypto.subtle.digest("SHA-256",await file.arrayBuffer());return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("")}async function publishVersion(){try{const file=document.getElementById("version-file").files[0],version=document.getElementById("version-number").value;if(!file)throw Error("Selecione o instalador.");const prep=await call("preparar_upload",{versao:version,sha256:await sha(file),tamanho_bytes:file.size,alteracoes:document.getElementById("version-notes").value,obrigatoria:document.getElementById("version-required").value==="true",liberacao_percentual:Number(document.getElementById("version-rollout").value)}),upload=await fetch(prep.upload_url,{method:"PUT",headers:{"Content-Type":"application/octet-stream"},body:file});if(!upload.ok)throw Error("Falha no upload privado.");await call("publicar",{id:prep.versao_id,liberacao_percentual:Number(document.getElementById("version-rollout").value)});closeModal("version-modal");load()}catch(e){document.getElementById("version-error").textContent=e.message}}
function closeModal(id){document.getElementById(id).classList.remove("show")}if(token){show();load()}
</script></body></html>
